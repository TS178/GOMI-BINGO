<script>
const ITEMS = [{"id":"pet","name":"ペットボトル","art":"assets/categories/pet.webp","desc":"これは海ごみとして拾ったペットボトルです。ラベルやフタは分別しなくても大丈夫です。","tip":"中身が残っていたら、気をつけながら空にしてね。"},{"id":"bottle","name":"びん","art":"assets/categories/bottle.webp","desc":"海岸に流れ着いたり、置き去りにされたりすることがあります。割れているものには注意が必要です。","tip":"割れたびんは手で拾わず、安全に注意して扱いましょう。"},{"id":"foam","name":"発泡スチロール","art":"assets/categories/foam.webp","desc":"魚箱や食品容器などに使われる軽い素材で、風や波で海へ流れ出ることがあります。","tip":"細かくなった発泡スチロールは特に散らばりやすいので、見つけたら大切に回収します。"},{"id":"rope","name":"ロープ・ひも","art":"assets/categories/rope.webp","desc":"漁業などで使われたロープやひもが海岸に流れ着くことがあります。","tip":"長いひもやロープは足にからまることがあるので、周りを確認して大人と一緒に拾いましょう。"},{"id":"plastic","name":"プラ製品","art":"assets/categories/plastic.webp","desc":"大きさや形をよく観察して、何に使われていたものか考えてみましょう。","tip":"中身が入っていたり、壊れやすいものもあるので、気をつけましょう。"},{"id":"metal","name":"缶・金属類","art":"assets/categories/metal.webp","desc":"飲料缶などの金属製品が海岸で見つかることがあります。","tip":"つぶれた缶やさびた金属は手を傷つけることがあるので、軍手やトングを使いましょう。"},{"id":"buoy","name":"ブイ・浮き","art":"assets/categories/buoy.webp","desc":"海で目印や道具として使われるブイや浮きが、海岸に流れ着くことがあります。","tip":"大きなものや重いものは無理に動かさず、安全に注意しましょう。"},{"id":"wood","name":"小さな木片","art":"assets/categories/wood.webp","desc":"木片は海岸で自然に見つかるものです。すべてが「ごみ」というわけではありません。海岸にあるものを見つけたら、「人が捨てたものかな？自然のものかな？」と考えてみましょう。","tip":"とがった部分や、ささくれがあることがあります。手で強く握らず、けがをしないように気をつけましょう。"}];
const QUIZZES = [{"no": "1", "question": "海に流れ出ている「海ごみ」の約8割は、どこから来ているでしょう？", "choices": ["船の上", "街や家", "海の底"], "answer": "B", "explanation": "ゴミの多くは、街でポイ捨てされたものが雨や風で川に流され、海まで届きます。海をきれいにするには、まず自分たちの街をきれいにすることが大切なんだね！", "related": "街のゴミ全般"}, {"no": "2", "question": "プラスチック製のレジ袋が海に流されると、ある海の生き物が「大好物のクラゲ」と間違えて食べてしまいます。その生き物はだれでしょう？", "choices": ["ウミガメ", "サメ", "ラッコ"], "answer": "A", "explanation": "ウミガメは海に浮かぶレジ袋をクラゲだと思って食べてしまい、お腹が痛くなってしまいます。買い物のときはマイバッグを使って、レジ袋をもらわない工夫をしよう！", "related": "レジ袋（プラスチック袋）"}, {"no": "3", "question": "海に捨てられたプラスチックごみが、波や太陽の光で細かくなった5ミリ以下の小さなごみを何と呼ぶでしょう？", "choices": ["ナノごみ", "マイクロプラスチック", "ぷちぷちプラスチック"], "answer": "B", "explanation": "とても小さいマイクロプラスチックは、魚がエサと間違えて食べてしまう問題になっています。一度海に出ると回収が難しいので、ごみを外に捨てないことが一番の予防だよ！", "related": "マイクロプラスチック"}, {"no": "4", "question": "海に捨てられたペットボトルが、完全になくなるまでにはどれくらいの時間がかかるでしょう？", "choices": ["約10年", "約100年", "約450年"], "answer": "C", "explanation": "プラスチックは自然に還りにくく、なんと450年も海に残り続けてしまいます。使い終わったペットボトルはしっかりと分別して、リサイクルに出そうね！", "related": "ペットボトル"}, {"no": "5", "question": "ペットボトルをリサイクルに出すとき、ラベルとキャップはどうするのが正しいでしょう？", "choices": ["つけたまま出す", "外して分ける", "キャップだけ握りつぶす"], "answer": "B", "explanation": "ペットボトルの本体、キャップ、ラベルはそれぞれ違う種類のプラスチックでできているよ。しっかり分けることで、新しいグッズに生まれ変わりやすくなります！", "related": "ペットボトル・キャップ"}, {"no": "6", "question": "海に捨てられた「漁網（魚をとるあみ）」や「釣り糸」が引き起こす、生き物への被害を何と呼ぶでしょう？", "choices": ["ゴーストフィッシング（幽霊漁業）", "忍者フィッシング", "ドリームフィッシング"], "answer": "A", "explanation": "捨てられたあみや糸が海を漂い、誰も乗っていないのに魚や鳥がからまって死んでしまう恐ろしい現象です。釣りをするときは糸や道具を絶対に持ち帰ろう！", "related": "漁具・釣り糸"}, {"no": "7", "question": "コンビニやスーパーで買い物をするとき、ゴミを増やさないための工夫として一番良い行動はどれでしょう？", "choices": ["手前にある賞味期限が近い商品を選ぶ", "奥にある新しい商品をえらぶ", "スプーンをたくさんもらっておく"], "answer": "A", "explanation": "賞味期限が近い「手前」の商品を選ぶ「手前どり」をすると、お店で捨てられる食べものや容器のゴミを減らせます。今日から買い物で試してみてね！", "related": "プラスチック容器・食品ごみ"}, {"no": "8", "question": "自動販売機の横にあるゴミ箱。ここに入れても良いものはどれでしょう？", "choices": ["飲み終わった缶・瓶・ペットボトル", "食べ終わったお弁当のガラ", "いらなくなったおもちゃ"], "answer": "A", "explanation": "自販機の横の箱は「リサイクルボックス」という缶やペットボトル専用の集積箱です。他のお弁当容器などを入れるとリサイクルの邪魔になってしまうよ！", "related": "缶・ペットボトル"}, {"no": "9", "question": "ごみを出さない・減らす取り組み「3R（スリーアール）」。ごみを「減らす（Reduce）」、「再利用する（Reuse）」と、もう一つは何でしょう？", "choices": ["リフレッシュ（Refresh）", "リサイクル（Recycle）", "リセット（Reset）"], "answer": "B", "explanation": "3Rは「リデュース（減らす）」「リユース（繰り返し使う）」「リサイクル（資源にする）」のこと。物を大切にしてゴミを減らす合言葉だよ！", "related": "ゴミ全般"}, {"no": "10", "question": "海ごみを減らすために、お家や学校の掃除でできる「一番大切なこと」は何でしょう？", "choices": ["ごみを風で外に吹き飛ばす", "落ちているゴミを見つけたら拾って適切に捨てる", "ごみを川に流して流す"], "answer": "B", "explanation": "落ちているごみを拾うことは、そのごみが海へ流れていくのを未然に防ぐ「ヒーローの行動」です！みんなのひと拾いが海を守るよ。", "related": "散乱ごみ"}, {"no": "11", "question": "アイスやゼリーを食べるとき、ゴミを減らすためにできる工夫はどれでしょう？", "choices": ["プラスプーンをもらわず、家にあるスプーンを使う", "スプーンを毎回使い捨てにする", "スプーンを3本もらう"], "answer": "A", "explanation": "使い捨てのプラスプーンを「いりません」と断るだけで、プラスチックゴミを減らすことができます。お家では自分専用のスプーンを使おう！", "related": "カトラリー（プラスチック）"}, {"no": "12", "question": "発泡スチロール（食品トレイや箱など）が海に浮いていると、波や光でどうなってしまうでしょう？", "choices": ["水に溶けて消える", "ボールのように丸くなる", "細かく砕けてバラバラになり広がる"], "answer": "C", "explanation": "発泡スチロールはとても割れやすく、バラバラになって細かくなります。海の鳥や魚がエサと間違えやすいので、外に放置しないことが大切です。", "related": "発泡スチロール"}, {"no": "13", "question": "家族でお弁当を持って公園や海に遊びに行きました。一番良いごみの処理方法は何でしょう？", "choices": ["誰かにあげる", "持ち帰ってお家で分別して捨てる", "公園の草むらに隠す"], "answer": "B", "explanation": "遊びに行った場所で出たごみは、お家まで持ち帰って正しく分別するのがルールです。風で飛ばされないように袋を結んでおくのも大切だよ！", "related": "弁当容器・行楽ごみ"}, {"no": "14", "question": "今日のゴミ拾いイベントが終わったあと、海をきれいに保つために一番大切なマインド（心構え）は何でしょう？", "choices": ["今日のことは今日で忘れる", "日常生活でも「ごみを出さない」「ポイ捨てしない」を続ける", "海に行かなければ関係ないと思う"], "answer": "B", "explanation": "海ごみ問題の解決は、イベントの日だけでなく「毎日の生活」から始まります。今日学んだことをお家や学校でも続けていこうね！", "related": "意識・行動変容"}, {"no": "15", "question": "海に落ちている「透明で丸くて固い、プラスチックの粒（ペレット）」。これの元々の姿（作られる前の形）は何でしょう？", "choices": ["お魚のおもちゃ", "プラスチック製品をつくる材料", "海の仕掛けおもちゃ"], "answer": "B", "explanation": "レジ袋や洗剤のボトルなど、プラスチック製品を作る「材料」が運ばれる途中にこぼれて海に流れることがあります。材料の段階から大切に管理することが必要なんだね！", "related": "レジ袋・ボトル材料（レジ袋・プラスチック）"}, {"no": "16", "question": "海に浮いている「ペットボトル」。長い時間太陽の光にあたると、どうなってしまうでしょう？", "choices": ["パキパキに割れて細かい破片になる", "とけてなくなる", "ふくらんで爆発する"], "answer": "A", "explanation": "プラスチックは太陽の光（紫外線）にあたるとボロボロになり、波の力で細かく砕けてしまいます。細かくなると拾うのが大変になるから、大きいうちに拾うのが大切！", "related": "ペットボトル・マイクロプラスチック"}, {"no": "17", "question": "まだ食べられるのに、すてられてしまう食べ物を何という？", "choices": ["食品ロス", "食品サンプル", "食品ブーム"], "answer": "A", "explanation": "食べ残しや、買ったのに使わずにすてた食べ物を「食品ロス」というよ。ごみとして燃やすと二酸化炭素も出るんだ。給食やごはんを残さず食べるのが、今日からできる第一歩だね。", "related": "食品ロス・生ごみ"}, {"no": "18", "question": "海で遊んだあと、使った「浮き輪（うきわ）」や「ビーチボール」に穴が開いちゃった！どうしよう？", "choices": ["砂浜に埋めて隠す", "直して使うか、持ち帰って正しく捨てる", "海に浮かべて流す"], "answer": "B", "explanation": "ビニール製のプール道具も、海に流れると大きなゴミになってしまいます。パッチを貼って直すか、使えなくなったらちゃんとお家に持ち帰ろうね！", "related": "ビニール遊具・行楽ゴミ"}, {"no": "19", "question": "海のお魚や鳥たちが、人間が出したゴミを食べてしまうと、体の中でどんな困ったことが起きるでしょう？", "choices": ["体がカラフルになる", "お腹がいっぱいだと勘違いして栄養不足になる", "声が高くなる"], "answer": "B", "explanation": "プラスチックはお腹の中で消化されないから、ずっと残ってお腹いっぱいの気になり、ごはんが食べられなくなっちゃうんだ。生き物を守るためにゴミを減らそう！", "related": "海洋プラスチックごみ"}, {"no": "20", "question": "海ごみを減らす合言葉「3R」。その中のひとつ「リユース（Reuse）」って、どういう意味かな？", "choices": ["1回使ったらすぐ捨てること", "なんでも燃やしてしまうこと", "洗ったり工夫したりして「繰り返し何度も使う」こと"], "answer": "C", "explanation": "シャンプーの詰め替えボトルを使ったり、お買い物の袋を何回も使ったりするのが「リユース」だよ！ものを大切に長く使うとゴミが減るね。", "related": "ゴミ削減（リユース）"}, {"no": "21", "question": "お買い物に行くとき、ビニール袋（レジ袋）をもらわないように持ち歩くバッグを何と呼ぶでしょう？", "choices": ["マイバッグ（エコバッグ）", "トレジャーバッグ", "四次元ポケット"], "answer": "A", "explanation": "マイバッグ（エコバッグ）をいつもカバンに入れておけば、レジ袋を断ることができるね！お気に入りの柄のバッグを探してみよう。", "related": "レジ袋・エコバッグ"}, {"no": "22", "question": "海ごみを拾う「ビーチクリーンイベント」。ゴミを拾うと、海がきれいになる以外にどんな「イイコト」があるかな？", "choices": ["宝の地図がもらえる", "背が2メートル伸びる", "街や海を愛する気持ちが強くなり、自分も周りも笑顔になる"], "answer": "C", "explanation": "自分でゴミを拾う体験をすると「ゴミを捨てないでおこう」「大切にしよう」という優しい気持ちが芽生えるよ。みんなで一緒にやると楽しいね！", "related": "イベント・意識変容"}, {"no": "23", "question": "海を綺麗にするために、今日からおうちでできる「一番はじめのアクション」はどれかな？", "choices": ["ゴミを決められた分別ルールに従って捨てる", "家中のものを全部海に投げる", "ごみ箱がないからポイ捨てする"], "answer": "A", "explanation": "特別なことをしなくても、おうちでゴミをしっかり分別して、ポイ捨てをしないことが海を守る第一歩！一人ひとりの小さな工夫が、大きな海を守るよ。", "related": "日常の分別・行動変容"}, {"no": "24", "question": "ソースやたれがついた、お弁当のプラスチック容器。どうやってごみに出す？", "choices": ["汚れたまま出す", "軽くすすぐか、ふきとってから出す", "海に置いていく"], "answer": "B", "explanation": "汚れを軽く取ると、リサイクルしやすくなるよ。なるべくリサイクルできるようにプラスチックごみに出そうね。", "related": "プラスチック容器包装"}, {"no": "25", "question": "あぶらでベタベタによごれたピザの箱。どう出すのがいい？", "choices": ["プラスチックごみ", "その他紙", "燃えるごみ"], "answer": "C", "explanation": "あぶらや食べものがしみた紙は、リサイクルのじゃまになってしまうんだ。よごれは「資源」にまぜないのがルール。", "related": "汚れた紙"}];
const KEY="umigomi_bingo_v2";
let state=null;
try { state=JSON.parse(localStorage.getItem(KEY)||"null"); } catch { /* Ignore unreadable data; do not crash startup. */ }
if(state && (!Array.isArray(state.layout) || !Array.isArray(state.opened) || state.opened.length!==9 || state.layout.length<8 || !state.layout.every(id=>ITEMS.some(item=>item.id===id)))) state=null;
let quizLaunchTimer=null;
let modalFocusBefore=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function init(){
 migratePlayerProfile();
 // A refresh during an unanswered item quiz must not grant the tile.
 if(state && Number.isInteger(state.pendingQuizPos)){
  state.opened[state.pendingQuizPos]=false;
  state.pendingQuizPos=null;state.quiz=null;state.lastQuizPos=null;save();
 }
 showNameScreen();
}

function showModal(content, label="ゲーム画面", backAction="handleModalClose()"){
 cancelBoardCelebration();
 const root=document.getElementById("modalRoot");
 if(root.classList.contains('hidden')) modalFocusBefore=document.activeElement;
 root.innerHTML=`<div class="modal-backdrop"><section class="modal-dialog" role="dialog" aria-modal="true" aria-label="${label}"><header class="modal-header"><button type="button" class="modal-back" onclick="${backAction}">← 戻る</button><span>${label}</span></header><div id="modalContent">${content}</div></section></div>`;
 root.classList.remove("hidden");
 document.getElementById('screen').inert=true;
 document.getElementById('mainNav').inert=true;
 root.querySelector('.modal-back').focus({preventScroll:true});
 root.onkeydown=e=>{
  if(e.key==='Escape'){e.preventDefault();root.querySelector('.modal-back').click();}
  if(e.key==='Tab'){
   const list=[...root.querySelectorAll('button:not(:disabled),[tabindex="0"]')].filter(x=>x.getClientRects().length);
   const first=list[0],last=list[list.length-1];
   if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
   else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
  }
 };
}

function setModalContent(content){
 const target=document.getElementById("modalContent");
 const moveFocus=target?.contains(document.activeElement);
 if(target) target.innerHTML=content; else showModal(content);
 const contentRoot=document.getElementById('modalContent'); if(contentRoot) contentRoot.scrollTop=0;
 if(moveFocus){
  const focusTarget=contentRoot?.querySelector('h2,.big')||document.querySelector('.modal-back');
  if(focusTarget){focusTarget.setAttribute('tabindex','-1');focusTarget.focus({preventScroll:true});}
 }
}
function handleModalClose(){
 clearTimeout(quizLaunchTimer);
 if(reviewQuizPos!==null){finishReviewQuiz();return;}
 if(document.querySelector('.quiz-result')){afterQuiz();return;}
 // 閉じるボタンでクイズ導入／クイズ本体を中断した場合は、そのマスを再度選べるように戻す
 const modalContent=document.getElementById("modalContent");
 if(modalContent && modalContent.querySelector(".quiz-cheer") && state && Number.isInteger(state.pendingQuizPos)){
   state.opened[state.pendingQuizPos]=false;
   state.lastQuizPos=null;
   state.pendingQuizPos=null;
   state.quiz=null;
   save();
 } else if(modalContent && modalContent.querySelector("#choices") && state && Number.isInteger(state.pendingQuizPos)){
   state.opened[state.pendingQuizPos]=false;
   state.lastQuizPos=null;
   state.pendingQuizPos=null;
   state.quiz=null;
   save();
 }
 closeModal();
 if(state) renderBoard();
}
function closeModal(){
 clearTimeout(quizLaunchTimer);
 const root=document.getElementById("modalRoot");
 const wasOpen=root && !root.classList.contains('hidden');
 if(root){root.classList.add("hidden");root.innerHTML="";}
 document.getElementById('screen').inert=false;
 document.getElementById('mainNav').inert=false;
 if(wasOpen && modalFocusBefore?.isConnected) modalFocusBefore.focus({preventScroll:true});
}

function gameLogo(className='app-logo'){
 return `<h1 class="${className}" aria-label="海ゴミBINGO！">${gameLogoMarkup()}</h1>`;
}
let pendingClearAnimation=null;
let reviewQuizPos=null;
function clearMedal(animate=false){
 return `<div class="clear-medal ${animate?'is-landing':''}" role="img" aria-label="クリア"><b>CLEAR</b></div>`;
}
function showStart(step=0){
 cancelBoardCelebration();
 closeModal();
 document.getElementById("mainNav").classList.add("hidden");
 const screen=document.getElementById('screen');screen.className='start-screen';
 screen.innerHTML=`<section class="guide-panel">
  <header class="guide-header">${step?'<button class="quiet" onclick="showStart(0)">← 戻る</button>':'<span></span>'}<span class="step-label">${step+1} / 2</span></header>
  ${gameLogo('app-logo welcome-logo')}

function startGame(){
 if(!getPlayerName()){showNameScreen();return;}
 if(state){renderBoard();return;}
 document.getElementById("mainNav").classList.remove("hidden");
 const ids=shuffle(ITEMS.map(x=>x.id));
 state={layout:ids,opened:Array(9).fill(false),firstBingo:false,complete:false,quiz:null,playerName:getPlayerName(),prizeGiven:false};
 state.opened[4]=true;
 save();
 renderBoard();
}
function itemById(id){return ITEMS.find(x=>x.id===id)}
function boardItemAt(pos){
 if(pos===4)return null;
 const itemIndex=pos<4?pos:pos-1;
 return itemById(state.layout[itemIndex]);
}
function setActiveTab(which){
 document.getElementById("mainNav").classList.remove("hidden");
 for(const name of ["Bingo","Quiz","Badge"]){const el=document.getElementById("tab"+name);if(el)el.classList.toggle("active",name===which);}
}
function renderBoard(){
 cancelBoardCelebration();
 closeModal();
 setActiveTab("Bingo");
 document.getElementById("screen").className="board-screen";
 if(state.prizeGiven===undefined) state.prizeGiven=false;
 save();
 const bingos=hasBingo();
 let html=`<header class="board-header"><div>${gameLogo()}</div><div class="board-tools"><button class="quiet" onclick="showStart()">あそび方</button><button class="quiet" onclick="resetConfirm()">やり直す</button></div></header><div class="board-progress"><span>集めたごみ <strong>${state.opened.filter(Boolean).length-1} / 8</strong></span><div class="progress"><div class="bar" style="width:${(state.opened.filter(Boolean).length-1)/8*100}%"></div></div><span>${state.complete?'コンプリート！':state.firstBingo?'ビンゴ達成！':'めざせ、ビンゴ！'}</span></div><div class="board">`;
 for(let pos=0;pos<9;pos++){
   if(pos===4){
     html+=`<div class="cell free open" data-pos="4"><div class="name">FREE</div></div>`;
   }else{
     const item=boardItemAt(pos), open=state.opened[pos], lastQuiz=(state.lastQuizPos===pos);
     html+=`<button type="button" data-pos="${pos}" class="cell ${open?'open':''} ${lastQuiz?'quiz-last':''} ${open&&pendingClearAnimation===pos?'is-clearing':''}" ${open?'aria-label="'+item.name+'：ふくしゅう"':''} onclick="openItem(${pos})"><div class="art">${open?clearMedal(pendingClearAnimation===pos):`<span class="icon-plate">${window.TILE_ICONS?.[item.id] || `<img src="${item.art}" alt="">`}</span>`}</div><div class="name">${rubyText(item.name)}${open?'<span class="review-hint">ふくしゅう ↗</span>':''}</div></button>`;
   }
 }
 html+=`</div>`;
 
html+=`<div class="board-footnote">${state.complete?"クリアしたマスをタップして、ふくしゅうしよう！":"たて・よこ・ななめ、3つそろえばビンゴ！"}</div>`;
 document.getElementById("screen").innerHTML=html;
 pendingClearAnimation=null;
 paintReachTargets();
 document.querySelector('.clear-medal.is-landing')?.addEventListener('animationend', e=>{
   e.currentTarget.classList.remove('is-landing');
   e.currentTarget.closest('.cell').classList.remove('is-clearing');
 },{once:true});
}

function relatedQuiz(item){
 // The source quiz labels use different words from the tile names (e.g. 漁具 / ロープ).
 // Use explicit topics; categories without a dedicated question review shared cleanup rules.
 const topics={pet:[4,5,8,16],bottle:[9,20,23],foam:[12],rope:[6],plastic:[2,3,7,11,15,19,21,24],metal:[8,20,23],buoy:[6,18],wood:[9,10,13,22,23]};
 const numbers=topics[item.id]||[1,9,10,14,22,23];
 return QUIZZES.filter(q=>numbers.includes(Number(q.no)));
}

function showQuiz(item){
 const pool=relatedQuiz(item),q=shuffle(pool.length?pool:QUIZZES)[0];
 if(reviewQuizPos===null){state.quiz={qno:q.no,item:item.id};save();}
 window.currentQuiz=q;
 setModalContent(quizQuestionCard(q));
}

function answerQuiz(i){

}

function afterQuiz(){
 if(reviewQuizPos!==null){finishReviewQuiz();return;}
 const pos=state.pendingQuizPos;
 const before=state.opened.slice();if(Number.isInteger(pos))before[pos]=false;
 const prior=completedBingoLines(before).map(line=>line.join(','));
 const newLines=Number.isInteger(pos)?completedBingoLines().filter(line=>!prior.includes(line.join(','))):[];
 const priorReach=reachLines(before).map(line=>line.join(','));
 const newReach=reachLines().some(line=>!priorReach.includes(line.join(',')))?reachTargets():[];
 const rewards=[];
 if(hasBingo()&&!state.firstBingo){state.firstBingo=true;rewards.push('bingo');}
 if(state.opened.every(Boolean)&&!state.complete){state.complete=true;rewards.push('complete');}
 if(Number.isInteger(pos))pendingClearAnimation=pos;
 state.quiz=null;state.pendingQuizPos=null;save();
 renderBoard();
 if(Number.isInteger(pos)||rewards.length)runBoardCelebration(pos,newLines,rewards,newReach);
}

 setModalContent(`<div class="card center"><div class="big">✓ 景品確認済み</div><p>なまえ：<strong>${escapeHTML(getPlayerName())}</strong></p><div class="notice">この参加者への景品のお渡しは完了しました。</div><button onclick="showBadgeScreen()">バッジへ戻る</button></div>`);
}
function resetConfirm(){
 showModal(`<div class="card center">
   
   <div class="big">最初からやり直しますか？</div>
   <p>これまでのビンゴの進み具合、バッジはリセットされます。</p>
   <div class="notice">本当に最初から始める場合は「最初から始める」を押してください。</div>
   <button class="gold" onclick="resetGame()">最初から始める</button>
   <button class="secondary" onclick="renderBoard()">やめる</button>
 </div>`,"確認");
}
function resetGame(){localStorage.removeItem(KEY);location.reload()}

try { init(); } catch (error) { console.error("ゲームの初期化エラー:", error); const screen=document.getElementById("screen"); if(screen) screen.innerHTML = '<div class="card center"><p>ゲームの読み込みでエラーが発生しました。</p><button onclick="location.reload()">再読み込み</button></div>'; }
</script>
